<body>
<canvas id="scene"></canvas>

<div id="loading">園區建造中…</div>
<div id="start" hidden><div class="panel"><h1>鳥類生態園</h1><p>帶著相機走進溫室，找鳥、拍照。</p>
<ul><li>WASD 走路、Shift 跑、空白鍵跳、按住 C 蹲低慢慢走</li><li>鳥會怕人：跑過去會把牠嚇飛，蹲低慢慢靠近；飛走的鳥等你離開會再回來</li><li>滑鼠右鍵按一下：舉起／放下相機（觀景窗），等對焦框變綠</li><li>滾輪：變焦　左鍵：拍照　Q：換鏡頭　舉著相機按 E：相機設定（自動／A／S／M、光圈、快門、ISO）</li><li>Tab：相簿　E：在入口的相機行賣照片、買鏡頭；在長椅旁坐下休息、跳到下一個時段</li><li>一天 24 分鐘：黃昏路燈會亮，晚上很暗、有螢火蟲</li></ul>
<button id="go">點一下開始</button></div></div>
