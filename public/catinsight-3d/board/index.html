<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cat Street Stocks</title>
<style>
  :root{--ink:#3b2f2a;--cream:#fff8ec;--line:#e8d9c2;--pink:#ff8fc0;--purple:#8b7cff;--teal:#35c2a1;--amber:#f5b942;--coral:#f2796b}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#cfe9dc;color:var(--ink);
    font-family:"Avenir Next","Nunito","Helvetica Neue",-apple-system,"PingFang TC",sans-serif}
  canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
  .hud{position:fixed;left:12px;right:12px;top:12px;display:flex;align-items:center;gap:10px;pointer-events:none;z-index:5}
  .ava{width:58px;height:58px;border-radius:50%;border:4px solid #fff;background:#ffd9e8 center/cover;flex:none;
    box-shadow:0 3px 0 rgba(0,0,0,.12)}
  .bar{flex:1;display:flex;align-items:center;gap:10px;background:var(--cream);border:2px solid var(--line);border-radius:16px;
    padding:7px 12px;box-shadow:0 3px 0 rgba(0,0,0,.1);pointer-events:auto;min-width:0}
  .pill{display:flex;align-items:center;gap:6px;background:#8a6f60;color:#fff;border-radius:999px;padding:4px 12px 4px 5px;font-weight:800;font-size:16px}
  .coin{width:22px;height:22px;border-radius:50%;background:#ffd24a;border:2px solid #e2a51c;display:inline-block}
  .stat{font-size:12px;font-weight:700;color:#8a6f60;line-height:1.15;white-space:nowrap}
  .stat b{display:block;font-size:15px;color:var(--ink)}
  .sp{flex:1}
  .chip{display:flex;align-items:center;gap:5px;font-weight:800;font-size:15px;white-space:nowrap}
  .chip i{font-style:normal;display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center;color:#fff;font-size:13px}
  .miss{position:fixed;left:12px;top:84px;z-index:5;display:flex;flex-direction:column;gap:6px;max-width:min(300px,62vw)}
  .m{background:var(--cream);border:2px solid var(--line);border-radius:12px;padding:6px 10px;font-size:12.5px;font-weight:700;
    display:flex;gap:8px;align-items:center;box-shadow:0 2px 0 rgba(0,0,0,.08);transition:background .3s,transform .3s}
  .m .ck{width:18px;height:18px;border-radius:50%;border:2px solid #c9b79f;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
  .m.done{background:#e3f7ea;border-color:#9ad9b0;transform:scale(1.02)}
  .m.done .ck{background:#35c26b;border-color:#35c26b}
  .m small{display:block;font-weight:600;color:#9a8676;font-size:11px}
  .ctl{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;justify-content:center;align-items:flex-end;gap:14px;z-index:6}
  .roll{width:104px;height:104px;border-radius:50%;border:6px solid #fff;background:#ff7a59;color:#fff;font-size:20px;font-weight:900;
    letter-spacing:.04em;box-shadow:0 6px 0 #d4553a,0 10px 18px rgba(0,0,0,.2);cursor:pointer;transition:transform .08s,box-shadow .08s}
  .roll:active{transform:translateY(4px);box-shadow:0 2px 0 #d4553a,0 4px 8px rgba(0,0,0,.2)}
  .roll small{display:block;font-size:11px;font-weight:700;opacity:.9;letter-spacing:0}
  .paw{height:54px;padding:0 16px;border-radius:999px;border:4px solid #fff;background:#7cc6ff;color:#fff;font-weight:900;font-size:14px;
    box-shadow:0 4px 0 #4f9bd6;cursor:pointer}
  .paw:disabled{background:#c9d3da;box-shadow:0 4px 0 #a9b3ba}
  .steps{display:flex;gap:8px}
  .steps button{width:54px;height:54px;border-radius:16px;border:4px solid #fff;background:#7cc6ff;color:#fff;font-weight:900;font-size:20px;box-shadow:0 4px 0 #4f9bd6;cursor:pointer}
  .panel{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(430px,calc(100vw - 24px));
    background:var(--cream);border:3px solid #fff;outline:2px solid var(--line);border-radius:22px;padding:14px 16px 16px;z-index:7;
    box-shadow:0 8px 0 rgba(0,0,0,.12),0 18px 30px rgba(0,0,0,.18);animation:pop .28s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{from{transform:translateX(-50%) translateY(30px) scale(.94);opacity:0}}
  .panel h3{font-size:19px;font-weight:900;display:flex;align-items:center;gap:8px}
  .tag{font-size:11px;font-weight:800;color:#fff;border-radius:999px;padding:2px 9px}
  .panel p{font-size:13.5px;line-height:1.45;margin-top:6px;font-weight:600;color:#6b594e}
  .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .kv div{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 8px;font-size:11px;font-weight:700;color:#9a8676}
  .kv b{display:block;font-size:15px;color:var(--ink)}
  .btns{display:flex;gap:8px;margin-top:12px}
  .btns button{flex:1;height:46px;border-radius:14px;border:0;font-weight:900;font-size:14px;color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.18)}
  .btns button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
  .b-buy{background:#35c26b}.b-sell{background:#f2796b}.b-skip{background:#a99b90}.b-ok{background:#8b7cff}
  .btns button:disabled{background:#d6ccc4;box-shadow:none;color:#fff}
  .moves{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .mv{font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px}
  .up{background:#e3f7ea;color:#1c8a4a}.dn{background:#fde7e3;color:#c4472f}
  .toast{position:fixed;left:50%;top:150px;transform:translateX(-50%);background:#3b2f2a;color:#fff;font-weight:800;font-size:14px;
    border-radius:999px;padding:8px 16px;z-index:8;opacity:0;transition:opacity .25s,top .25s;pointer-events:none;white-space:nowrap}
  .toast.on{opacity:1;top:140px}
  .end{position:fixed;inset:0;background:rgba(59,47,42,.45);z-index:9;display:flex;align-items:center;justify-content:center;padding:16px}
  .card{width:min(400px,100%);background:var(--cream);border:4px solid #fff;border-radius:26px;padding:22px 20px;text-align:center;
    box-shadow:0 10px 0 rgba(0,0,0,.15);animation:pop2 .35s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop2{from{transform:scale(.85);opacity:0}}
  .stars{font-size:46px;letter-spacing:6px;color:#e2d6c6}.stars b{color:#ffc93c}
  .card h2{font-size:24px;font-weight:900;margin-top:4px}
  .card p{font-size:14px;font-weight:600;color:#6b594e;margin-top:8px;line-height:1.5}
  .note{position:fixed;left:0;right:0;bottom:2px;text-align:center;font-size:10.5px;font-weight:700;color:rgba(59,47,42,.55);z-index:4;pointer-events:none}
  .hide{display:none!important}
  @media(max-width:560px){ .stat.opt{display:none} .ava{width:48px;height:48px} .miss{top:72px} .m{font-size:11.5px;padding:5px 8px} .m small{display:none} }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="gl"></canvas>

<div class="hud">
  <div class="ava" style="background-image:url(/assets/app-icon.png)"></div>
  <div class="bar">
    <div class="pill"><span class="coin"></span><span id="cash">10,000</span></div>
    <div class="stat"><span>Total assets</span><b id="assets">10,000</b></div>
    <div class="stat opt"><span>Stocks</span><b id="stocks">0</b></div>
    <div class="sp"></div>
    <div class="chip"><i style="background:#7cc6ff">P</i><span id="paws">2</span></div>
    <div class="chip"><i style="background:#ffb000">★</i><span id="mcount">0/3</span></div>
  </div>
</div>
<div class="miss" id="miss"></div>

<div class="ctl" id="ctl">
  <button class="paw" id="pawBtn">Use paw</button>
  <button class="roll" id="rollBtn">ROLL<small id="rollsLeft"></small></button>
  <div style="width:96px"></div>
</div>
<div class="ctl hide" id="stepCtl">
  <div class="steps" id="steps"></div>
</div>
<div class="panel hide" id="panel"></div>
<div class="toast" id="toast"></div>
<div class="end hide" id="end"></div>
<div class="note">Fictional companies · for learning, not investment advice</div>

<script type="module" src="./board.mjs?v=2"></script>
</body>
</html>
