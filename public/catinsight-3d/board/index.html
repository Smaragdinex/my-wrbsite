<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cat Street Stocks</title>
<link rel="preload" as="image" href="card-event.webp"><link rel="preload" as="image" href="card-fate.webp"><link rel="preload" as="image" href="card-gift.webp">
<link rel="manifest" href="/catinsight-3d/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CatInsight">
<meta name="theme-color" content="#c9e8b8">
<link rel="apple-touch-icon" href="/catinsight-3d/icon-192.png">
<link rel="stylesheet" href="style.css?v=3">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="gl"></canvas>

<div class="hud">
  <div class="ava" id="avaMe" style="background-image:url(/assets/app-icon.png)"></div>
  <div class="bar">
    <div class="pill"><span class="coin"></span><span id="cash">10,000</span></div>
    <div class="stat"><span id="lblAssets"></span><b id="assets">10,000</b></div>
    <div class="stat opt"><span id="lblStocks"></span><b id="stocks">0</b></div>
    <div class="chip"><i style="background:#ffb000">★</i><span id="mcount">0</span></div>
    <div class="sp"></div>
    <button class="more" id="barMore" aria-label="assets">▾</button>
    <button class="snd" id="sndBtn">♪</button>
    <button class="snd fs hide" id="fsBtn" aria-label="fullscreen"></button>
  </div>
</div>
<div class="miss" id="miss"></div>
<div class="rbanner hide" id="remoteBanner"></div>
<div class="side">
  <div class="bubble"><span class="av ex">!</span><span id="tip"></span></div>
  <div class="box"><h4><span id="assetTitle"></span><span class="tri"></span></h4><div class="tabs" id="assetTabs"></div><div id="assetRows"></div></div>
</div>
<div class="box ev evt"><h4 id="evtTitle"></h4><div class="body" id="evtBody"></div></div>
<div class="msheet hide" id="mSheet"></div>
<div class="round"><span id="roundTxt"></span><span id="rankTxt" class="rank"></span><div class="trk"><b id="roundBar"></b></div></div>

<div class="ctl" id="ctl">
  <button class="paw bag" id="bagBtn" aria-label="backpack">🎒<b id="bagCount">1</b></button>
  <div class="rollcol">
    <div class="dsel" id="dsel"><button data-n="1" id="d1"></button><button data-n="2" id="d2" class="on"></button></div>
    <button class="roll" id="rollBtn"><span id="rollTxt"></span></button>
  </div>
  <button class="paw bag" id="mapBtn" style="background:#8bd17c;box-shadow:0 4px 0 #5fa651">🗺️</button>
</div>
<div class="ctl hide" id="stepCtl">
  <div class="steps" id="steps"></div>
</div>
<div class="panel hide" id="panel"></div>
<div class="toast" id="toast"></div>
<div class="pickui">
  <div class="ptop">
    <div class="pcfg" id="pcfg">
      <div class="seg"><span id="pcN"></span><button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button></div>
      <div class="seg" id="pcHrow"><span id="pcH"></span><button data-h="1">1</button><button data-h="2">2</button></div>
      <button class="online" id="pcOnline"></button>
      <div class="lobby hide" id="lobby"></div>
      <small id="pcAI"></small>
      <div class="seg wide" id="pcDrow"><span id="pcD"></span><button data-d="easy"></button><button data-d="normal"></button><button data-d="hard"></button></div>
      <div class="seg wide"><span id="pcM"></span><span class="step" id="pcR"><button data-r="-1" aria-label="fewer rounds">▼</button><b id="pcRv">20</b><button data-r="1" aria-label="more rounds">▲</button></span></div>
      <small id="pcRule"></small>
    </div>
  </div>
  <div class="pbar">
    <div class="pnav"><button id="pprev" aria-label="previous">‹</button><b id="pname"></b><button id="pnext" aria-label="next">›</button></div>
    <input class="pnameIn" id="pnameIn" type="text" maxlength="12" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="pok" id="pok"></button>
  </div>
</div>
<div class="draw hide" id="draw"></div>
<div class="end hide" id="end"></div>
<div class="note" id="note"></div>

<script type="module" src="./board.mjs?v=129"></script>
</body>
</html>
