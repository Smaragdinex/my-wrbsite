<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CatInsight Stock — Room</title>
<meta name="description" content="CatInsight Stock — step into the room. AI stock research for US and Taiwan markets." />
<link rel="icon" type="image/png" href="/assets/favicon.png" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", "Noto Sans TC", sans-serif;
    background: radial-gradient(120% 90% at 50% 40%, #3a2a66 0%, #2a1f4e 45%, #1d1538 100%);
    color: #fff; overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .brand { position: fixed; top: 22px; left: 26px; display: flex; align-items: center; gap: 10px; z-index: 5; text-decoration: none; color: #fff; }
  .brand img { width: 34px; height: 34px; border-radius: 9px; }
  .brand b { font-weight: 700; letter-spacing: .2px; }
  .brand span { opacity: .65; font-weight: 500; }
  #loading {
    position: fixed; inset: 0; display: grid; place-items: center; z-index: 9; background: #2a1f4e;
    transition: opacity .6s; font-size: 14px; letter-spacing: .3px; opacity: .9;
  }
  #loading.done { opacity: 0; pointer-events: none; }
  .cta { position: fixed; right: 28px; bottom: 34px; z-index: 5; display: flex; gap: 10px; }
  .cta a { text-decoration: none; padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; }
  .cta .primary { background: #ff6f91; color: #fff; }
  .cta .ghost { background: rgba(255,255,255,.12); color: #fff; }
  /* 螢幕介面:鏡頭定在螢幕後淡入,一頁一頁介紹功能 */
  #screen-ui {
    position: fixed; inset: 0; z-index: 6; background: #0b0e17; color: #fff;
    opacity: 0; pointer-events: none; transition: opacity .55s ease; overflow: hidden; touch-action: none;
    background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 64px 64px;
  }
  #screen-ui.on { opacity: 1; pointer-events: auto; }
  #screen-ui .track { position: absolute; inset: 0; transition: transform .75s cubic-bezier(.65,0,.25,1); will-change: transform; }
  #screen-ui .slide { position: absolute; left: 0; right: 0; height: 100%; display: grid; place-items: center; text-align: center; padding: 0 24px; }
  #screen-ui .slide > div { max-width: 640px; }
  #screen-ui .icon { width: 108px; height: 108px; margin: 0 auto 28px; border-radius: 30px; display: grid; place-items: center; font-size: 56px;
    background: linear-gradient(145deg, #2a2352, #151a33); box-shadow: 0 18px 50px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12); }
  #screen-ui h2 { font-size: clamp(30px, 5vw, 52px); font-weight: 800; letter-spacing: -.5px; line-height: 1.08; margin-bottom: 16px; }
  #screen-ui p { font-size: clamp(16px, 2vw, 20px); line-height: 1.55; opacity: .82; }
  #screen-ui .zh { margin-top: 12px; font-size: 15px; opacity: .55; }
  #screen-ui .store { display: inline-flex; align-items: center; gap: 10px; margin-top: 26px; padding: 14px 26px; border-radius: 999px;
    background: #fff; color: #0b0e17; font-weight: 700; text-decoration: none; font-size: 17px; }
  #screen-ui .soon { margin-top: 14px; font-size: 14px; opacity: .5; }
  #screen-ui .green { color: #4be07a; }
  #screen-ui .num { position: absolute; top: 24px; right: 28px; font-size: 13px; letter-spacing: 2px; opacity: .55; font-variant-numeric: tabular-nums; }
  #screen-ui .dots { position: absolute; right: 26px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; }
  #screen-ui .dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.22); cursor: pointer; transition: all .25s; }
  #screen-ui .dots i.on { background: #fff; height: 22px; border-radius: 4px; }
  #screen-ui .more { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); font-size: 13px; opacity: .5; animation: nudge 1.6s ease-in-out infinite; }
  #screen-ui .back { position: absolute; bottom: 20px; left: 26px; font-size: 13px; opacity: .55; cursor: pointer; background: none; border: 0; color: #fff; }
  @keyframes nudge { 0%,100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, 6px); } }
  body.ui-on .cta { opacity: 0; pointer-events: none; }
  .cta { transition: opacity .4s; }
  @media (max-width: 640px) { .hint, .cta { display: none; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="c"></canvas>
<a class="brand" href="/catinsight.html"><img src="/assets/icon-180.png" alt=""><b>CatInsight</b><span>Stock</span></a>
<div class="cta">
  <a class="ghost" href="/catinsight.html">Learn more</a>
  <a class="primary" href="https://apps.apple.com/app/id6763914049">Get the App</a>
</div>
<div id="screen-ui">
  <div class="track"></div>
  <div class="num"></div>
  <div class="dots"></div>
  <div class="more">scroll ↓</div>
  <button class="back">← back to the room</button>
</div>
<div id="loading">building the room…</div>
<script type="module" src="./room.mjs?v=47"></script>
</body>
</html>
