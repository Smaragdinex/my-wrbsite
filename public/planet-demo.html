<html lang="zh-Hant">

    <!-- Google AdSense:驗證網站擁有權 + 放送廣告。必須在每一頁的 <head> 裡 -->

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Micro Planet — 貓咪小星球 demo</title>
<style>
  html,body{margin:0;height:100%;background:#0a0f1a;overflow:hidden;
    font-family:"Helvetica Neue",-apple-system,"PingFang TC",sans-serif;color:#eaf2ff}
  canvas{display:block}
  .hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:10;
    background:rgba(10,15,26,.5);border:1px solid rgba(180,210,255,.18);backdrop-filter:blur(8px);
    padding:10px 18px;border-radius:999px;font-size:13px;letter-spacing:.04em;pointer-events:none}
  .hint b{color:#9fd0ff}
  .title{position:fixed;left:24px;top:20px;z-index:10;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:rgba(234,242,255,.75)}
</style>
</head>
<body>
<div class="title">Micro Planet · 貓咪小星球</div>
<div class="hint"><b>W A S D</b> / 方向鍵 — 讓貓咪在小星球上自由探索　·　城市在腳下鋪開</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ===== 基本設定 ===== */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const SKY = new THREE.Color('#bfe0ff');
scene.background = SKY;
scene.fog = new THREE.FogExp2(SKY, 0.011);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 400);

/* ===== 光 ===== */
scene.add(new THREE.HemisphereLight('#dcefff', '#42502f', 0.85));
const sun = new THREE.DirectionalLight('#fff4e0', 1.15);
sun.position.set(40, 60, 25);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
const S = 40;
sun.shadow.camera.left=-S; sun.shadow.camera.right=S; sun.shadow.camera.top=S; sun.shadow.camera.bottom=-S;
sun.shadow.camera.near=1; sun.shadow.camera.far=180; sun.shadow.bias=-0.0005;
scene.add(sun);
scene.add(new THREE.AmbientLight('#ffffff', 0.12));

/* ===== 星球 ===== */
const R = 20;
const planet = new THREE.Mesh(
  new THREE.SphereGeometry(R, 96, 96),
  new THREE.MeshStandardMaterial({ color:'#5f8f4e', roughness:.95, metalness:0, flatShading:false })
);
planet.receiveShadow = true;
scene.add(planet);
// 大氣光暈
scene.add(new THREE.Mesh(new THREE.SphereGeometry(R*1.14, 48,48),
  new THREE.MeshBasicMaterial({ color:'#bfe0ff', transparent:true, opacity:.10, side:THREE.BackSide })));

/* ===== 把物件貼到球面(它的 +Y 對齊球面法線) ===== */
const YUP = new THREE.Vector3(0,1,0);
function placeOnPlanet(obj, dir){
  dir.normalize();
  obj.position.copy(dir).multiplyScalar(R);
  obj.quaternion.setFromUnitVectors(YUP, dir);
}
// 在某方向附近的球面隨機取一個方向(做出聚落)
function nearDir(center, spread){
  const t1 = new THREE.Vector3().crossVectors(center, YUP.clone().add(new THREE.Vector3(.3,0,.1))).normalize();
  const t2 = new THREE.Vector3().crossVectors(center, t1).normalize();
  return center.clone()
    .addScaledVector(t1, (Math.random()*2-1)*spread)
    .addScaledVector(t2, (Math.random()*2-1)*spread).normalize();
}

/* ===== 城市(方塊建築,聚在一區) ===== */
const cityDir = new THREE.Vector3(0.2, 1, 0.35).normalize();
const bColors = ['#e7ddc9','#d7c7b0','#cdd6df','#b9c3cf','#e3b7a0','#a9b8a0','#c9b6cf'];
for (let i=0;i<26;i++){
  const w = 1.2+Math.random()*1.6, d = 1.2+Math.random()*1.6, h = 1.6+Math.random()*4.2;
  const g = new THREE.Group();
  const b = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({ color:bColors[i%bColors.length], roughness:.85 }));
  b.position.y = h/2; b.castShadow = true; b.receiveShadow = true;
  g.add(b);
  // 屋頂小方塊
  if(Math.random()<.5){ const r=new THREE.Mesh(new THREE.BoxGeometry(w*.5,.5,d*.5),
    new THREE.MeshStandardMaterial({color:'#8a94a0',roughness:.8})); r.position.y=h+.25; r.castShadow=true; g.add(r); }
  placeOnPlanet(g, nearDir(cityDir, 0.16));
  scene.add(g);
}

/* ===== 樹 & 石頭(散落全球,探索感) ===== */
for (let i=0;i<46;i++){
  const g = new THREE.Group();
  if(Math.random()<.7){ // 樹
    const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.12,.16,.7,6),new THREE.MeshStandardMaterial({color:'#6b4a2f',roughness:1}));
    trunk.position.y=.35; trunk.castShadow=true; g.add(trunk);
    const leaf=new THREE.Mesh(new THREE.ConeGeometry(.7,1.5,7),new THREE.MeshStandardMaterial({color:'#3f7a43',roughness:.9}));
    leaf.position.y=1.35; leaf.castShadow=true; g.add(leaf);
  } else { // 石頭
    const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.4+Math.random()*.4,0),new THREE.MeshStandardMaterial({color:'#8b8f96',roughness:1,flatShading:true}));
    rock.position.y=.3; rock.castShadow=true; rock.receiveShadow=true; g.add(rock);
  }
  placeOnPlanet(g, new THREE.Vector3(Math.random()*2-1,Math.random()*2-1,Math.random()*2-1).normalize());
  scene.add(g);
}

/* ===== 佔位貓咪(面向 -Z,之後可換成你的 glb) ===== */
function makeCat(){
  const cat = new THREE.Group();
  const grey = new THREE.MeshStandardMaterial({ color:'#6a6f78', roughness:.85 });
  const pink = new THREE.MeshStandardMaterial({ color:'#e6a2ab', roughness:.9 });
  const dark = new THREE.MeshStandardMaterial({ color:'#20242b', roughness:.6 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(.7,.6,1.1), grey); body.position.set(0,.5,0); cat.add(body);
  const head = new THREE.Mesh(new THREE.BoxGeometry(.6,.55,.5), grey); head.position.set(0,.78,-.62); cat.add(head);
  const earL = new THREE.Mesh(new THREE.ConeGeometry(.16,.28,4), grey); earL.position.set(-.18,1.12,-.62); cat.add(earL);
  const earR = earL.clone(); earR.position.x=.18; cat.add(earR);
  const eL = new THREE.Mesh(new THREE.SphereGeometry(.06,8,8), dark); eL.position.set(-.15,.82,-.88); cat.add(eL);
  const eR = eL.clone(); eR.position.x=.15; cat.add(eR);
  const nose = new THREE.Mesh(new THREE.SphereGeometry(.05,8,8), pink); nose.position.set(0,.72,-.9); cat.add(nose);
  const tail = new THREE.Mesh(new THREE.BoxGeometry(.12,.12,.7), grey); tail.position.set(0,.7,.6); tail.rotation.x=-.6; cat.add(tail);
  for(const sx of [-1,1]) for(const sz of [-1,1]){ // 四腿
    const leg=new THREE.Mesh(new THREE.BoxGeometry(.16,.4,.16), grey); leg.position.set(sx*.22,.2,sz*.38); cat.add(leg);
  }
  cat.traverse(o=>{ if(o.isMesh){o.castShadow=true;} });
  return cat;
}
const cat = new THREE.Group();          // 控制器移動這個容器
scene.add(cat);
let placeholder = makeCat(); cat.add(placeholder);   // 載入前先顯示佔位貓
let catModel = null;

new GLTFLoader().load('/assets/cat2_web.glb', (gltf)=>{
  const model = gltf.scene;
  // 自動置中 + 縮放到目標高度 + 腳底貼地
  let box = new THREE.Box3().setFromObject(model);
  const size = new THREE.Vector3(); box.getSize(size);
  const s = 1.5 / (size.y || 1);
  model.scale.setScalar(s);
  box = new THREE.Box3().setFromObject(model);
  model.position.x -= (box.min.x+box.max.x)/2;
  model.position.z -= (box.min.z+box.max.z)/2;
  model.position.y -= box.min.y;
  model.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.frustumCulled=false; } });
  cat.remove(placeholder);
  cat.add(model);
  catModel = model;
  console.log('cat loaded, size=', size);
}, undefined, (e)=>console.log('glTF load error', e));

/* ===== 微型星球控制器 ===== */
let up = new THREE.Vector3(0,1,0);
let heading = new THREE.Vector3(0,0,-1);       // 起始面向(切線)
let pos = up.clone().multiplyScalar(R);
const keys = {};
addEventListener('keydown', e=>{ keys[e.code]=true; if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault(); });
addEventListener('keyup', e=>{ keys[e.code]=false; });
const MOVE=7.0, TURN=2.3;

const camPos = camera.position.clone();
let bob=0;

function update(dt){
  const fwd = (keys['KeyW']||keys['ArrowUp'])?1 : (keys['KeyS']||keys['ArrowDown'])?-1 : 0;
  const turn = (keys['KeyA']||keys['ArrowLeft'])?1 : (keys['KeyD']||keys['ArrowRight'])?-1 : 0;
  if(turn) heading.applyAxisAngle(up, turn*TURN*dt);
  if(fwd){
    pos.addScaledVector(heading, MOVE*dt*fwd);
    up.copy(pos).normalize();
    pos.copy(up).multiplyScalar(R);
    heading.addScaledVector(up, -heading.dot(up)).normalize();   // 重新正交(貼回切線)
    bob += Math.abs(fwd)*dt*12;
  }
  // 擺貓
  cat.up.copy(up);
  cat.position.copy(pos);
  cat.lookAt(pos.clone().add(heading));
  cat.position.addScaledVector(up, Math.sin(bob)*0.05);          // 走路時上下微彈

  // 相機:貓後方 + 上方,平滑跟隨
  const target = pos.clone().addScaledVector(up, 6.2).addScaledVector(heading, -11);
  camPos.lerp(target, 1-Math.pow(0.001, dt));
  camera.position.copy(camPos);
  camera.up.copy(up);
  camera.lookAt(pos.clone().addScaledVector(up, 2.2));
}

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// 初始相機
camPos.copy(pos).addScaledVector(up,6.2).addScaledVector(heading,-11);
camera.position.copy(camPos); camera.up.copy(up); camera.lookAt(pos);

let last=performance.now();
renderer.setAnimationLoop(()=>{
  const now=performance.now(); const dt=Math.min(.033,(now-last)/1000); last=now;
  update(dt);
  renderer.render(scene, camera);
});
</script>
</body>
</html>
