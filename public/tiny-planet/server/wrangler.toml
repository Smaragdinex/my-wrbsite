name = "tiny-planet-room"
main = "worker.js"
compatibility_date = "2026-01-01"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# Durable Object 第一次部署要宣告 migration,否則 wrangler 會拒絕。
# 一定要用 new_sqlite_classes:免費方案只支援 SQLite 後端的 Durable Object,
# 寫成 new_classes(key-value 後端)會被要求升級付費方案。
# 這個房間根本不寫入儲存,純記憶體轉發,用哪種後端都無所謂。
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
