<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<title>示範：太空人首頁 — X-Arts</title>
<link rel="stylesheet" href="/assets/site.css?v=11">
<style>
  /* 示範頁:只做首頁第一屏。太空人用粒子組成(跟原本的粒子 X 同一個語彙),臉上一副像素墨鏡 */
  html,body{height:100%;overflow:hidden}
  canvas#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
  .demo-badge{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:50;background:#ff8fa3;color:#2a0f16;
    font:700 13px/1 -apple-system,"PingFang TC",sans-serif;padding:8px 14px;border-radius:999px;letter-spacing:.04em}
  .hint{position:fixed;left:50%;bottom:52px;transform:translateX(-50%);z-index:5;font-size:12px;letter-spacing:.2em;
    text-transform:uppercase;color:rgba(242,242,240,.45);pointer-events:none}
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div class="wrap">
  <header>
    <div class="face" id="face" data-look="2.6">
      <svg viewBox="0 0 100 100" width="56" height="56" aria-hidden="true">
        <defs>
          <clipPath id="catbg"><circle cx="50" cy="50" r="49"/></clipPath>
          <radialGradient id="catIris" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#8f8c46"/><stop offset=".7" stop-color="#b3a552"/><stop offset="1" stop-color="#c4b25c"/></radialGradient>
          <filter id="coverBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation=".7"/></filter>
          <filter id="lidSoft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.8"/></filter>
          <mask id="lidMask" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><g filter="url(#lidSoft)"><ellipse cx="30.83" cy="49.57" rx="14.18" ry="11.38" fill="#fff"/><ellipse cx="68.50" cy="45.73" rx="14.05" ry="11.30" fill="#fff"/></g></mask>
          <clipPath id="eyeL"><ellipse cx="30.83" cy="52.17" rx="9.02" ry="8.18"/></clipPath>
          <clipPath id="eyeR"><ellipse cx="68.50" cy="48.33" rx="8.85" ry="8.10"/></clipPath>
        </defs>
        <g clip-path="url(#catbg)">
          <image href="/assets/cat-logo.jpg?v=1" x="0" y="0" width="100" height="100"/>
          <g id="eyes">
            <g class="eye"><ellipse cx="31.83" cy="51.67" rx="6.3" ry="6.9" fill="url(#catIris)" filter="url(#coverBlur)"/>
              <g clip-path="url(#eyeL)"><ellipse class="pupil" cx="31.83" cy="51.67" rx="4.9" ry="5.7" fill="#080606"/><circle class="pupil" cx="30.3" cy="49.2" r="1.3" fill="#f4f6fa"/></g></g>
            <g class="eye"><ellipse cx="67.58" cy="47.92" rx="6.3" ry="6.9" fill="url(#catIris)" filter="url(#coverBlur)"/>
              <g clip-path="url(#eyeR)"><ellipse class="pupil" cx="67.58" cy="47.92" rx="4.9" ry="5.7" fill="#080606"/><circle class="pupil" cx="66.1" cy="45.4" r="1.3" fill="#f4f6fa"/></g></g>
          </g>
          <g class="lids"><image href="/assets/cat-logo-closed.jpg?v=1" x="0" y="0" width="100" height="100" mask="url(#lidMask)"/></g>
        </g>
      </svg>
    </div>
    <div class="topright">
      <nav class="topnav"><a href="/about.html">About</a><a href="#">Contact</a></nav>
      <div class="brand"><b>X·ARTS</b><span>Studio&nbsp;— 2026</span></div>
    </div>
  </header>
  <div class="center"></div>
  <footer><span></span><span>xarts.games</span></footer>
</div>

<div class="hint">Move your mouse through the astronaut</div>
<div class="demo-badge">示範：首頁換成戴像素墨鏡的太空人</div>

<script>
// ===== 左上貓:眼睛跟滑鼠、眨眼(正式首頁是 shell.mjs 在做,這裡示範頁自己來) =====
const face = document.getElementById('face'), pupils = face.querySelectorAll('.pupil'), eyesG = document.getElementById('eyes');
const LOOK = +(face.dataset.look || 4.6);
(function blink(){ eyesG.classList.add('blink'); setTimeout(() => eyesG.classList.remove('blink'), 140); setTimeout(blink, 2200 + Math.random() * 3200); })();

// ===== 太空人粒子 =====
const cv = document.getElementById('sky'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const mouse = { x: -9999, y: -9999, tx: -9999, ty: -9999, inside: false };
addEventListener('pointermove', e => { mouse.tx = e.clientX; mouse.ty = e.clientY; mouse.inside = true;
  const r = face.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2), d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 260) * LOOK;
  pupils.forEach(p => p.setAttribute('transform', `translate(${(dx / d * k).toFixed(1)} ${(dy / d * k).toFixed(1)})`)); });
addEventListener('pointerleave', () => { mouse.inside = false; mouse.tx = mouse.ty = -9999; });

// 1) 先在一張看不見的畫布上畫太空人(向量),再把畫出來的像素取樣成粒子
const ART_W = 520, ART_H = 620;
function drawAstronaut(g) {
  const W2 = ART_W / 2;
  g.lineJoin = 'round'; g.lineCap = 'round';
  const suit = '#eef1f6', shade = '#c9d0de', line = '#9aa4b8';
  // 背包
  g.fillStyle = '#b8c0cf'; roundRect(g, W2 - 120, 300, 240, 190, 40); g.fill();
  // 腿
  g.fillStyle = suit;
  roundRect(g, W2 - 92, 450, 78, 120, 34); g.fill(); roundRect(g, W2 + 14, 450, 78, 120, 34); g.fill();
  g.fillStyle = '#7c8699'; roundRect(g, W2 - 98, 540, 90, 46, 20); g.fill(); roundRect(g, W2 + 8, 540, 90, 46, 20); g.fill();
  // 身體
  g.fillStyle = suit; roundRect(g, W2 - 112, 300, 224, 190, 70); g.fill();
  g.fillStyle = shade; roundRect(g, W2 - 112, 430, 224, 40, 20); g.fill();
  // 胸前面板+按鈕
  g.fillStyle = '#d7dce6'; roundRect(g, W2 - 54, 352, 108, 70, 16); g.fill();
  [['#ff6b6b', -28], ['#ffd166', 0], ['#5ec8ff', 28]].forEach(([c, dx]) => { g.fillStyle = c; g.beginPath(); g.arc(W2 + dx, 376, 10, 0, Math.PI * 2); g.fill(); });
  g.fillStyle = '#9ad48a'; roundRect(g, W2 - 38, 398, 76, 12, 6); g.fill();
  // 手臂:左手揮手(往上)、右手垂著
  g.strokeStyle = suit; g.lineWidth = 64;
  g.beginPath(); g.moveTo(W2 - 98, 340); g.quadraticCurveTo(W2 - 175, 300, W2 - 190, 210); g.stroke();
  g.beginPath(); g.moveTo(W2 + 98, 340); g.quadraticCurveTo(W2 + 160, 380, W2 + 165, 455); g.stroke();
  g.fillStyle = '#7c8699';
  g.beginPath(); g.arc(W2 - 192, 196, 38, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.arc(W2 + 166, 468, 36, 0, Math.PI * 2); g.fill();
  // 頭盔:兩個小貓耳+大圓頭
  g.fillStyle = suit;
  tri(g, W2 - 128, 90, W2 - 98, 6, W2 - 52, 64); tri(g, W2 + 128, 90, W2 + 98, 6, W2 + 52, 64);
  g.fillStyle = '#ffb3bd'; tri(g, W2 - 112, 74, W2 - 97, 32, W2 - 72, 62); tri(g, W2 + 112, 74, W2 + 97, 32, W2 + 72, 62);
  g.fillStyle = suit; g.beginPath(); g.arc(W2, 190, 150, 0, Math.PI * 2); g.fill();
  g.strokeStyle = line; g.lineWidth = 6; g.beginPath(); g.arc(W2, 190, 150, 0, Math.PI * 2); g.stroke();
  // 面罩:深藍,帶一道反光
  const vg = g.createLinearGradient(W2 - 110, 110, W2 + 110, 270);
  vg.addColorStop(0, '#2a3a6b'); vg.addColorStop(1, '#0e1530');
  g.fillStyle = vg; roundRect(g, W2 - 112, 120, 224, 150, 72); g.fill();
  g.fillStyle = 'rgba(160,200,255,.75)'; g.beginPath(); g.ellipse(W2 - 62, 150, 34, 12, -0.5, 0, Math.PI * 2); g.fill();
  // 頸環
  g.fillStyle = '#aab3c4'; roundRect(g, W2 - 96, 320, 192, 26, 13); g.fill();
}
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function tri(g, ax, ay, bx, by, cx2, cy2) { g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.lineTo(cx2, cy2); g.closePath(); g.fill(); }

const off = document.createElement('canvas'); off.width = ART_W; off.height = ART_H;
const og = off.getContext('2d'); drawAstronaut(og);
const STEP = 5;   // 每 5 像素取一顆粒子
const pts = [];
{ const d = og.getImageData(0, 0, ART_W, ART_H).data;
  for (let y = 0; y < ART_H; y += STEP) for (let x = 0; x < ART_W; x += STEP) {
    const i = (y * ART_W + x) * 4; if (d[i + 3] < 128) continue;
    pts.push({ hx: x, hy: y, x: x + (Math.random() - .5) * 900, y: y + (Math.random() - .5) * 900, vx: 0, vy: 0,
      c: `rgb(${d[i]},${d[i + 1]},${d[i + 2]})`, tw: Math.random() * 6.28 });
  } }

// 2) 像素墨鏡(8-bit 款):1 = 黑、2 = 白色反光
const SHADES = [
  '1111111111111111111111',
  '1111111111111111111111',
  '0111112211100111112211',
  '0011122111000011122111',
  '0001111110000001111110',
  '0000111100000000111100',
];
const CELL = 10;                                  // 一格在太空人畫布上 10 像素
const SH_W = SHADES[0].length * CELL;
const SH_X = ART_W / 2 - SH_W / 2, SH_Y = 156;    // 戴好時的位置(面罩中間)

// 3) 星空
let stars = [];
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  stars = Array.from({ length: Math.round(W * H / 2600) }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.2 + .2, a: Math.random() * .7 + .2, t: Math.random() * 6.28 }));
}
addEventListener('resize', resize); resize();

const t0 = performance.now();
let glint = 0;   // 墨鏡反光掃過(0~1)
function frame(now) {
  const t = (now - t0) / 1000;
  ctx.fillStyle = '#08080a'; ctx.fillRect(0, 0, W, H);
  for (const s of stars) { ctx.globalAlpha = s.a * (0.6 + 0.4 * Math.sin(t * 1.3 + s.t)); ctx.fillStyle = '#fff'; ctx.fillRect(s.x, s.y, s.r, s.r); }
  ctx.globalAlpha = 1;

  // 太空人在畫面中的位置與大小;整個人慢慢上下漂、微微轉
  const scale = Math.min(W / ART_W * 0.62, H / ART_H * 0.74);
  const ox = W / 2 - ART_W * scale / 2 + Math.sin(t * 0.5) * 10, oy = H / 2 - ART_H * scale / 2 + Math.sin(t * 0.8) * 14 + 10;
  const rot = Math.sin(t * 0.45) * 0.06, cx = ART_W / 2, cy = ART_H / 2;
  const cosr = Math.cos(rot), sinr = Math.sin(rot);
  const toScreen = (x, y) => { const dx = x - cx, dy = y - cy; return [ox + (cx + dx * cosr - dy * sinr) * scale, oy + (cy + dx * sinr + dy * cosr) * scale]; };

  mouse.x += (mouse.tx - mouse.x) * .3; mouse.y += (mouse.ty - mouse.y) * .3;
  const R = 90, size = Math.max(1.6, STEP * scale * 0.82);
  for (const p of pts) {
    const [hx, hy] = toScreen(p.hx, p.hy);
    // 彈簧拉回原位+滑鼠推開
    let ax = (hx - p.x) * 0.06, ay = (hy - p.y) * 0.06;
    const dx = p.x - mouse.x, dy = p.y - mouse.y, d2 = dx * dx + dy * dy;
    if (d2 < R * R) { const d = Math.sqrt(d2) || 1, f = (1 - d / R) * 9; ax += dx / d * f; ay += dy / d * f; }
    p.vx = (p.vx + ax) * 0.82; p.vy = (p.vy + ay) * 0.82; p.x += p.vx; p.y += p.vy;
    ctx.fillStyle = p.c; ctx.globalAlpha = 0.85 + 0.15 * Math.sin(t * 2 + p.tw);
    ctx.fillRect(p.x - size / 2, p.y - size / 2, size, size);
  }
  ctx.globalAlpha = 1;

  // 像素墨鏡:1.6 秒後從畫面上方掉下來戴上(落地彈一下);滑鼠靠近臉時反光掃過
  const drop = Math.min(1, Math.max(0, (t - 1.6) / 0.9));
  const ease = drop < 1 ? 1 - Math.pow(1 - drop, 3) * Math.cos(drop * 4.2) : 1;
  const yOff = (1 - ease) * -(SH_Y + 400);
  const [fx, fy] = toScreen(cx, SH_Y + 40);
  if (Math.hypot(mouse.x - fx, mouse.y - fy) < 140 * scale && glint <= 0) glint = 1;
  if (glint > 0) glint -= 0.025;
  const sweep = glint > 0 ? (1 - glint) * (SHADES[0].length + 6) - 3 : -99;
  const cell = CELL * scale;
  for (let r = 0; r < SHADES.length; r++) for (let c = 0; c < SHADES[r].length; c++) {
    const v = SHADES[r][c]; if (v === '0') continue;
    const [sx, sy] = toScreen(SH_X + c * CELL + CELL / 2, SH_Y + r * CELL + CELL / 2 + yOff);
    const lit = Math.abs(c - r - sweep) < 1.2;
    ctx.fillStyle = v === '2' || lit ? '#ffffff' : '#050505';
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(rot); ctx.fillRect(-cell / 2, -cell / 2, cell + .5, cell + .5); ctx.restore();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
