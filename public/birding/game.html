<script>
(function () {
  var zh = true
  try { var l = localStorage.getItem('lang'); zh = l ? /^zh/.test(l) : /^zh/i.test(navigator.language || '') } catch (e) {}
  var ua = navigator.userAgent || ''
  var inApp = /FBAN|FBAV|FB_IAB|Instagram|Barcelona|Threads|Line\/|MicroMessenger|KAKAOTALK|; wv\)/i.test(ua)
  var phone = (matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 820) || /iPhone|iPod|Android.+Mobile/i.test(ua)
  var T = zh ? {
    t: inApp && !phone ? '請用瀏覽器開啟' : '請用電腦開啟',
    b: (inApp ? 'App 內建的瀏覽器跑不動這個 3D 遊戲。' : '') + 'Birdwatch 是需要電腦顯示卡的 3D 遊戲，手機目前還不支援。請在電腦上用 Chrome、Edge 或 Safari 打開這個網址：',
    c: '複製連結', d: '已複製', g: '仍然試試看',
    s: '載入好像卡住了。可以重新整理再試一次；如果一直卡住，請改用電腦的 Chrome 或 Edge。', r: '重新整理'
  } : {
    t: inApp && !phone ? 'Open in a browser' : 'Please play on a computer',
    b: (inApp ? 'In-app browsers can\'t run this 3D game. ' : '') + 'Birdwatch is a 3D game that needs a desktop graphics card; phones are not supported yet. Open this link in Chrome, Edge or Safari on a computer:',
    c: 'Copy link', d: 'Copied', g: 'Try anyway',
    s: 'Loading seems stuck. Try reloading; if it keeps happening, please use Chrome or Edge on a computer.', r: 'Reload'
  }
  var url = 'https://xarts.games/birding/game.html'
  function el(tag, css, txt) { var e = document.createElement(tag); if (css) e.style.cssText = css; if (txt != null) e.textContent = txt; return e }
  var btn = 'font:600 15px system-ui,sans-serif;padding:11px 20px;border-radius:10px;border:0;cursor:pointer;margin:6px'
  function gate() {
    var o = el('div', 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(180deg,#4a5878,#2c2a33);color:#fff;font:16px/1.6 system-ui,sans-serif;text-align:center')
    o.id = 'device-gate'
    var box = el('div', 'max-width:420px')
    box.appendChild(el('div', 'font-size:13px;letter-spacing:.2em;opacity:.7;margin-bottom:6px', 'BIRDWATCH'))
    box.appendChild(el('h1', 'font-size:24px;margin:0 0 12px', T.t))
    box.appendChild(el('p', 'margin:0 0 14px;opacity:.92', T.b))
    box.appendChild(el('div', 'font:600 15px ui-monospace,monospace;background:rgba(255,255,255,.12);padding:10px;border-radius:8px;word-break:break-all;user-select:all;-webkit-user-select:all;margin-bottom:14px', url))
    var c = el('button', btn + ';background:#f2c46d;color:#2c2a33', T.c)
    c.onclick = function () {
      var ok = function () { c.textContent = T.d }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(ok, function () {})
      else { var a = el('textarea'); a.value = url; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); ok() } catch (e) {} a.remove() }
    }
    var g = el('button', btn + ';background:rgba(255,255,255,.16);color:#fff', T.g)
    g.onclick = function () { o.remove(); try { sessionStorage.setItem('bw.tryPhone', '1') } catch (e) {} }
    box.appendChild(c); box.appendChild(g); o.appendChild(box)
    document.body.appendChild(o)
    window.gtag && gtag('event', 'device_gate', { in_app: inApp, phone: phone })
  }
  var q = new URLSearchParams(location.search), tried = false
  try { tried = sessionStorage.getItem('bw.tryPhone') === '1' } catch (e) {}
  var showGate = (phone || inApp) && !tried && !q.has('rec') && !q.has('tier') && !q.has('nogate')
  // 載入條：同一個數字停太久（0% 停 20 秒、其他 45 秒）就在下面加提示＋重新整理鈕
  var last = null, since = 0, warned = null
  function watch() {
    var ld = document.getElementById('loading'), n = document.getElementById('ld-num')
    if (!ld || !n) return
    var shown = !ld.hidden && !ld.classList.contains('done') && getComputedStyle(ld).display !== 'none'
    if (!shown) { last = null; return }
    var v = n.textContent, now = Date.now()
    if (v !== last) { last = v; since = now; if (warned) { warned.remove(); warned = null } return }
    if (!warned && now - since > (v === '0' ? 20000 : 45000)) {
      warned = el('div', 'margin-top:14px;font:14px/1.6 system-ui,sans-serif;max-width:360px;text-align:center;color:#33413f')
      warned.appendChild(el('div', '', T.s))
      var r = el('button', btn + ';background:#33413f;color:#fff', T.r); r.onclick = function () { location.reload() }
      warned.appendChild(r)
      ld.querySelector('.ld').appendChild(warned)
      window.gtag && gtag('event', 'load_stall', { pct: +v })
    }
  }
  document.addEventListener('DOMContentLoaded', function () { if (showGate) gate(); setInterval(watch, 1000) })
})()
