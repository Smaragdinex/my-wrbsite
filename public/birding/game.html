<script>
// 2026-11-28 使用者：「一開始讀取永遠 0%，然後直接到主畫面」。主畫面出現前要先下載約 90 個程式檔（main.js 還沒跑，setLoad 動不了），
// 這裡每載完一個檔就往前推，讓玩家知道有在跑；main.js 一開始執行就呼叫 __bootLd() 交回給 setLoad
(function () {
  var N = 90, n = 0, num = document.getElementById('ld-num'), msg = document.getElementById('ld-msg'), box = document.getElementById('loading')
  var fill = box.querySelector('.ld-fill'), bird = box.querySelector('.ld-bird'), lang = 'zh'
  try { lang = localStorage.getItem('lang') || (navigator.language || '').slice(0, 2) } catch (e) {}
  msg.textContent = { en: 'Loading game files…', ko: '게임 파일을 불러오는 중…', ja: 'ゲームデータを読み込み中…' }[lang] || '載入遊戲程式…'
  function show() { var p = Math.min(99, Math.round(n / Math.max(N, n + 3) * 100)); num.textContent = p; fill.style.width = p + '%'; bird.style.left = p + '%' }
  var ob = window.PerformanceObserver && new PerformanceObserver(function (l) { l.getEntries().forEach(function (e) { if (/\.m?js(\?|$)/.test(e.name)) n++ }); show() })
  try { ob && ob.observe({ type: 'resource', buffered: true }) } catch (e) {}
  window.__bootLd = function () { try { ob && ob.disconnect() } catch (e) {} num.textContent = '0'; fill.style.width = '0%'; bird.style.left = '0%'; msg.textContent = '' }
})()
</script>
